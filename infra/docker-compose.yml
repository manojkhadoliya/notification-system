name: notification-system

# Phase 0 scaffold (see docs/roadmap.md): the infra containers only.
# `services/*` app containers are added once each has a Dockerfile and a
# real entrypoint (Phase 1) — see infra/README.md.
#
# All ports/credentials below are local-dev defaults, not secrets — do not
# reuse them anywhere but a developer's own machine.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
      POSTGRES_DB: notification
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-broker KRaft mode — no separate Zookeeper (see ADR 0002).
  # Topics are NOT created here; run `pnpm kafka:topics` once this is
  # healthy (see infra/kafka/create-topics.sh and messaging.md#topic-layout).
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    # Host port 9092 forwards to the *container's* 29092 — the
    # PLAINTEXT_HOST listener below, advertised as localhost:9092. The
    # PLAINTEXT listener stays on container port 9092 unpublished, used
    # only by other containers on the compose network via the `kafka`
    # hostname (advertised as kafka:9092). Publishing 9092:9092 instead
    # (matching container port to host port) looks right but isn't: a
    # host client's TCP connection would land on the PLAINTEXT listener,
    # which hands back `kafka:9092` in its metadata response for the
    # follow-up produce/fetch connection — unresolvable outside Docker.
    # Found by actually running this against a host process (see
    # docs/local-development.md).
    ports:
      - "9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "notification-system-local-kraft"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 15

  # Trace backend for packages/observability's OTLP exporter. UI at
  # http://localhost:16686; OTLP/HTTP receiver on 4318 (what services send
  # to), OTLP/gRPC on 4317 (unused for now — the exporter is HTTP-only).
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP — OTEL_EXPORTER_OTLP_ENDPOINT target

  # --- Phase 1 app services (Phase B — full containerization; see
  # docs/local-development.md#3-phase-b--full-containerization) ---
  #
  # All ten built from the repo-root ../Dockerfile, one shared,
  # parameterized image (see that file's own comment). Every service
  # here talks to infra over the compose network by container hostname
  # (`postgres`, `redis`, `kafka:9092` — the PLAINTEXT listener, not
  # PLAINTEXT_HOST; see the `kafka` service's own comment above) and
  # `http://jaeger:4318` for tracing — never `localhost`, unlike Phase
  # A's host processes and .env.example's host-oriented defaults.
  #
  # `migrate` applies packages/infra-postgres/prisma/migrations/ once,
  # before any app service starts — every DATABASE_URL-using service
  # depends on it via `condition: service_completed_successfully`, not
  # just `depends_on: postgres`. Phase A never needed this as a separate
  # step because it was run by hand once, directly on the host (see
  # §2.3a); a fresh containerized stack has no such one-time step unless
  # something runs it.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notification
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notification
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  router:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: router
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notification
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: scheduler
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notification
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      SCHEDULER_BUCKET: "0"
      SCHEDULER_BUCKET_COUNT: "1"
      SCHEDULER_CLAIM_LIMIT: "100"
      SCHEDULER_POLL_INTERVAL_MS: "5000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  fanout-expander:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: fanout-expander
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notification
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  projection-notification:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: projection-notification
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notification
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-sms:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: worker-sms
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notification
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # SMS_PROVIDER unset — mock gateway, same as Phase A (see §1).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-push:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: worker-push
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notification
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # PUSH_PROVIDER unset — mock gateway, same as Phase A (see §1).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-email:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: worker-email
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notification
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-inapp:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: worker-inapp
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notification
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  inapp-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: inapp-gateway
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  kafka-data:
